name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up environment
        shell: pwsh
        run: .\setup.ps1

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: models-bn-vosk-2026-02-09-whisper-base

      - name: Download speech models
        shell: pwsh
        run: .\download-model.ps1

      - name: Build portable app
        shell: pwsh
        run: .\build-portable.ps1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Kothok ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Kothok-portable.zip
            dist/Kothok-update.zip

      - name: Upload build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Kothok
          path: dist/Kothok-update.zip
